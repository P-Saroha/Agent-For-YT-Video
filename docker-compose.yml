version: '3.8'

services:
  web:
    build: .
    container_name: ai-content-assistant
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    env_file:
      - server/.env
    volumes:
      # Mount for hot reload during development
      - ./server:/app/server
      - ./static:/app/static
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge
