<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube + Web AI Assistant</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.2/marked.min.js"></script>
    
    <!-- Local Styles -->
    <link rel="stylesheet" href="css/youtube-web-ai.css">
    
    <!-- Local Scripts -->
    <script src="js/youtube-web-ai.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Assistant</h1>
            <p class="subtitle">Analyze YouTube videos and websites with AI</p>
        </div>

        <div class="main-content">
            <!-- Mode Selector -->
            <div class="mode-selector">
                <button class="mode-btn active" onclick="switchMode('youtube')">
                    YouTube Analysis
                </button>
                <button class="mode-btn" onclick="switchMode('web')">
                    Website Analysis
                </button>
            </div>

        <!-- YouTube Section -->
        <div id="youtube-section" class="form-section active">
            <div class="quick-examples">
                <h4>Quick Examples (Click to try):</h4>
                <div class="example-item" onclick="setYouTubeUrl('https://www.youtube.com/watch?v=dQw4w9WgXcQ')">
                    Music video example
                </div>
                <div class="example-item" onclick="setYouTubeUrl('https://youtu.be/dQw4w9WgXcQ')">
                    Short URL format
                </div>
            </div>

            <div class="form-group">
                <label for="youtube-url">YouTube Video URL:</label>
                <input type="text" id="youtube-url" placeholder="Paste YouTube video URL here..." value="">
                <button type="button" onclick="copyYouTubeLink()" class="share-btn">
                    Copy Shareable Link
                </button>
            </div>

            <div class="form-group">
                <label for="youtube-question">Your Question (optional):</label>
                <textarea id="youtube-question" rows="3" placeholder="Ask anything about the video... (leave empty to get video summary)"></textarea>
            </div>

            <button class="primary-btn" onclick="processYouTube()">Analyze Video</button>
        </div>

        <!-- Website Section -->
        <div id="web-section" class="form-section">
            <div class="quick-examples">
                <h4>Popular Websites (Click to try):</h4>
                <div class="examples-grid">
                    <div class="example-item" onclick="setWebUrl('https://en.wikipedia.org/wiki/Artificial_intelligence')">
                        Wikipedia: AI article (Recommended)
                    </div>
                    <div class="example-item" onclick="setWebUrl('https://www.bbc.com/news')">
                        BBC News
                    </div>
                </div>
                <p class="examples-note">
                    <strong>Note:</strong> Some sites may not work due to advanced loading. Wikipedia and BBC work best.
                </p>
            </div>

            <div class="form-group">
                <label for="web-url">Website URL:</label>
                <input type="text" id="web-url" placeholder="Enter any website URL..." value="">
                <button type="button" onclick="copyWebLink()" class="share-btn">
                    Copy Shareable Link
                </button>
            </div>

            <div class="form-group">
                <label for="web-action">Action:</label>
                <select id="web-action" onchange="toggleWebQuestion()">
                    <option value="extract">Extract website content</option>
                    <option value="question">Ask question about website</option>
                </select>
            </div>

            <div class="form-group" id="web-question-group">
                <label for="web-question">Your Question:</label>
                <textarea id="web-question" rows="3" placeholder="What would you like to know about this website?"></textarea>
            </div>

            <button class="primary-btn" onclick="processWebsite()">Analyze Website</button>
        </div>

        <!-- Results -->
        <div id="result"></div>
        </div>
    </div>
</body>
</html>
