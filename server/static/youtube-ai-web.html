<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube AI Assistant - Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        input[type="url"], textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="url"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        button {
            flex: 1;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-process {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }

        .btn-process:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.3);
        }

        .btn-ask {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: white;
        }

        .btn-ask:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(67, 233, 123, 0.3);
        }

        .btn-clear {
            background: linear-gradient(135deg, #fa709a, #fee140);
            color: white;
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(250, 112, 154, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            margin-top: 30px;
        }

        .result {
            background: #f8f9ff;
            border: 2px solid #e8ecff;
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
            line-height: 1.6;
        }

        .result h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .result .answer {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-size: 1.1em;
            color: #333;
        }

        .error {
            background: #ffebee;
            border: 2px solid #ffcdd2;
            color: #c62828;
        }

        .success {
            background: #e8f5e8;
            border: 2px solid #c8e6c9;
            color: #2e7d32;
        }

        .status-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .quick-questions {
            margin: 20px 0;
        }

        .quick-questions h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .quick-question-btn {
            display: inline-block;
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .quick-question-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 YouTube AI Assistant</h1>
            <p>Analyze YouTube videos and get intelligent answers</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <div class="input-group">
                    <label for="videoUrl">📺 YouTube Video URL</label>
                    <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." />
                </div>
                
                <div class="input-group">
                    <label for="question">❓ Your Question</label>
                    <textarea id="question" placeholder="Ask anything about the video... e.g., 'Give me a summary of this video'"></textarea>
                </div>

                <div class="quick-questions">
                    <h4>Quick Questions:</h4>
                    <span class="quick-question-btn" onclick="setQuestion('Give me a summary of this video')">📝 Summary</span>
                    <span class="quick-question-btn" onclick="setQuestion('What are the main points discussed?')">🎯 Main Points</span>
                    <span class="quick-question-btn" onclick="setQuestion('List the key takeaways')">📋 Key Takeaways</span>
                    <span class="quick-question-btn" onclick="setQuestion('What is this video about?')">🔍 About</span>
                </div>
                
                <div class="button-group">
                    <button class="btn-process" onclick="processVideo()">🚀 Process Video</button>
                    <button class="btn-ask" onclick="askQuestion()">💬 Ask Question</button>
                    <button class="btn-clear" onclick="clearAll()">🗑️ Clear All</button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your request...</p>
            </div>

            <div class="result-section" id="results">
                <!-- Results will appear here -->
            </div>
        </div>
    </div>

    <script>
        // Auto-detect API base URL
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_BASE_URL = isLocalhost ? 'http://127.0.0.1:8000' : window.location.origin;
        let currentVideoId = null;
        let currentVideoUrl = null;

        console.log('API Base URL:', API_BASE_URL);

        function setQuestion(questionText) {
            document.getElementById('question').value = questionText;
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.querySelectorAll('button').forEach(btn => btn.disabled = true);
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.querySelectorAll('button').forEach(btn => btn.disabled = false);
        }

        function showResult(content, type = 'success') {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<div class="result ${type}">${content}</div>`;
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        async function processVideo() {
            const videoUrl = document.getElementById('videoUrl').value.trim();
            
            if (!videoUrl) {
                showResult('<h3>❌ Error</h3><p>Please enter a YouTube video URL</p>', 'error');
                return;
            }

            showLoading();

            try {
                const response = await fetch(`${API_BASE_URL}/langchain/process-video`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ video_url: videoUrl })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                currentVideoId = data.video_id;
                currentVideoUrl = videoUrl;

                showResult(`
                    <h3>✅ Video Processed Successfully!</h3>
                    <div class="answer">
                        <strong>Video ID:</strong> ${data.video_id}<br>
                        <strong>Title:</strong> ${data.title}<br>
                        <strong>Channel:</strong> ${data.channel}<br>
                        <strong>Status:</strong> ${data.status}<br>
                        <strong>Chunks:</strong> ${data.chunks_count}
                    </div>
                    <div class="status-info">
                        <span>Processed at: ${new Date(data.processed_at).toLocaleString()}</span>
                        <span>Language: ${data.language}</span>
                    </div>
                    <p><strong>Now you can ask questions about this video!</strong></p>
                `);

            } catch (error) {
                console.error('Process video error:', error);
                showResult(`
                    <h3>❌ Processing Failed</h3>
                    <div class="answer">
                        <strong>Error:</strong> ${error.message}
                    </div>
                    <p>Please check if the server is running and try again.</p>
                `, 'error');
            } finally {
                hideLoading();
            }
        }

        async function askQuestion() {
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const question = document.getElementById('question').value.trim();
            
            if (!videoUrl) {
                showResult('<h3>❌ Error</h3><p>Please enter a YouTube video URL first</p>', 'error');
                return;
            }

            if (!question) {
                showResult('<h3>❌ Error</h3><p>Please enter a question</p>', 'error');
                return;
            }

            // Extract video ID if not already processed
            if (!currentVideoId) {
                currentVideoId = extractVideoId(videoUrl);
                currentVideoUrl = videoUrl;
                if (!currentVideoId) {
                    showResult('<h3>❌ Error</h3><p>Invalid YouTube URL format</p>', 'error');
                    return;
                }
            }

            showLoading();

            try {
                const response = await fetch(`${API_BASE_URL}/langchain/ask-question`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        video_id: currentVideoId,
                        question: question 
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                showResult(`
                    <h3>💡 Answer</h3>
                    <div class="answer">
                        <strong>Question:</strong> ${data.question}<br><br>
                        <strong>Answer:</strong><br>
                        ${data.answer}
                    </div>
                    <div class="status-info">
                        <span>Confidence: ${Math.round(data.confidence * 100)}%</span>
                        <span>Response time: ${data.response_time.toFixed(2)}s</span>
                        <span>Sources: ${data.sources ? data.sources.length : 0}</span>
                    </div>
                `);

            } catch (error) {
                console.error('Ask question error:', error);
                showResult(`
                    <h3>❌ Question Failed</h3>
                    <div class="answer">
                        <strong>Error:</strong> ${error.message}
                    </div>
                    <p>Please make sure the video is processed first or try again.</p>
                `, 'error');
            } finally {
                hideLoading();
            }
        }

        function clearAll() {
            document.getElementById('videoUrl').value = '';
            document.getElementById('question').value = '';
            document.getElementById('results').innerHTML = '';
            currentVideoId = null;
            currentVideoUrl = null;
        }

        // Auto-populate question if empty
        document.getElementById('videoUrl').addEventListener('input', function() {
            const question = document.getElementById('question');
            if (!question.value.trim()) {
                question.value = 'Give me a summary of this video';
            }
        });
    </script>
</body>
</html>
